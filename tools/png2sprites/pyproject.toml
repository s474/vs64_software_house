[project]
name = "png2sprites"
version = "0.1.0"
description = "Convert 24x21 hires and 12x21 multicolour sprite sheets (PNG) to C64 sprite data, checking C64 constraints"
readme = "README.md"
authors = [
    { name = "Simon Adams", email = "simonjadams@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
png2sprites = "png2sprites:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
