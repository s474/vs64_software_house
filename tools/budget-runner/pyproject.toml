[project]
name = "budget-runner"
version = "0.1.0"
description = "Build the engine test programs, run them in VICE and check measured cycle counts against their budget.json files"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
budget-runner = "budget_runner.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
